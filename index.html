<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Enchanted Journal</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500&family=IM+Fell+English:ital@0;1&family=Cinzel:wght@400;500;600&family=Lato:wght@300;400&display=swap" rel="stylesheet">
<style>
:root {
  --parchment: #F5ECD7;
  --parchment2: #EDE0C4;
  --parchment3: #E8D5B0;
  --dark-brown: #2C1A0E;
  --mid-brown: #5C3317;
  --warm-brown: #7B4A1E;
  --gold: #C9A84C;
  --gold-light: #E8C97A;
  --gold-pale: #F5E6B8;
  --rust: #8B3A1A;
  --ink: #1A0A00;
  --line: #C4A882;
  --faint: #DDD0B8;
  --gryffindor: #740001;
  --slytherin: #1A472A;
  --ravenclaw: #0E1A40;
  --hufflepuff: #F0C75E;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

/* ── PASSWORD SCREEN ── */
#password-screen {
  position: fixed; inset: 0; z-index: 9999;
  background: radial-gradient(ellipse at center, #1a0800 0%, #0d0500 70%);
  display: flex; align-items: center; justify-content: center;
  flex-direction: column;
}
#password-screen .lock-stars {
  position: absolute; inset: 0; pointer-events: none;
}
.lock-card {
  position: relative; z-index: 1;
  text-align: center;
  padding: 52px 48px;
  border: 1.5px solid var(--gold);
  max-width: 420px; width: 90%;
  background: linear-gradient(160deg, rgba(26,8,0,0.95), rgba(44,18,4,0.98));
  box-shadow: 0 0 80px rgba(201,168,76,0.15), 0 0 160px rgba(0,0,0,0.8);
}
.lock-card::before {
  content: '';
  position: absolute; inset: 6px;
  border: 0.5px solid rgba(232,201,122,0.25);
  pointer-events: none;
}
.lock-icon {
  font-size: 36px;
  margin-bottom: 16px;
  display: block;
  animation: lockFloat 3s ease-in-out infinite;
}
@keyframes lockFloat {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}
.lock-title-small {
  font-family: 'Cinzel', serif;
  font-size: 10px; letter-spacing: 4px;
  color: rgba(201,168,76,0.6);
  text-transform: uppercase;
  margin-bottom: 10px;
}
.lock-title {
  font-family: 'IM Fell English', serif;
  font-size: 34px;
  color: var(--gold);
  line-height: 1.15;
  margin-bottom: 6px;
}
.lock-divider {
  display: flex; align-items: center; gap: 10px;
  margin: 14px 0 20px;
  color: var(--gold); font-size: 10px;
}
.lock-divider::before, .lock-divider::after {
  content: ''; flex: 1;
  height: 1px; background: linear-gradient(90deg, transparent, var(--gold));
}
.lock-divider::after { transform: scaleX(-1); }
.lock-sub {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 13px;
  color: rgba(232,201,122,0.55);
  margin-bottom: 28px;
  line-height: 1.5;
}
.lock-input-wrap {
  position: relative; margin-bottom: 14px;
}
.lock-input {
  width: 100%;
  background: rgba(201,168,76,0.06);
  border: 1px solid rgba(201,168,76,0.35);
  border-radius: 3px;
  padding: 13px 48px 13px 16px;
  font-family: 'Cormorant Garamond', serif;
  font-size: 16px;
  color: var(--gold-light);
  outline: none;
  text-align: center;
  letter-spacing: 3px;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.lock-input:focus {
  border-color: var(--gold);
  box-shadow: 0 0 16px rgba(201,168,76,0.15);
}
.lock-input::placeholder {
  color: rgba(232,201,122,0.25);
  letter-spacing: 1px;
  font-style: italic;
}
.toggle-pw {
  position: absolute; right: 14px; top: 50%;
  transform: translateY(-50%);
  background: none; border: none;
  color: rgba(201,168,76,0.45);
  cursor: pointer; font-size: 14px;
  transition: color 0.2s;
}
.toggle-pw:hover { color: var(--gold); }
.lock-btn {
  width: 100%;
  background: linear-gradient(135deg, var(--gold), var(--gold-light));
  border: none;
  border-radius: 3px;
  padding: 13px;
  font-family: 'Cinzel', serif;
  font-size: 11px;
  letter-spacing: 3px;
  color: var(--dark-brown);
  cursor: pointer;
  text-transform: uppercase;
  transition: all 0.2s;
  margin-top: 4px;
}
.lock-btn:hover {
  box-shadow: 0 0 24px rgba(201,168,76,0.4);
  transform: translateY(-1px);
}
.lock-btn:active { transform: translateY(0); }
.lock-error {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 13px;
  color: #c44;
  margin-top: 12px;
  min-height: 20px;
  opacity: 0;
  transition: opacity 0.3s;
}
.lock-error.show { opacity: 1; }
.lock-footer {
  font-family: 'Cinzel', serif;
  font-size: 8px;
  letter-spacing: 2px;
  color: rgba(201,168,76,0.25);
  margin-top: 28px;
  text-transform: uppercase;
}
@keyframes unlockFade {
  from { opacity: 1; transform: scale(1); }
  to { opacity: 0; transform: scale(1.04); }
}
.unlocking {
  animation: unlockFade 0.6s ease forwards;
}

body {
  background: #0D0500;
  min-height: 100vh;
  font-family: 'Lato', sans-serif;
  color: var(--dark-brown);
  overflow-x: hidden;
}

/* ── STARFIELD ── */
.stars {
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background: radial-gradient(ellipse at center, #1a0a00 0%, #0d0500 70%);
}
.star {
  position: absolute; width: 2px; height: 2px;
  background: var(--gold-light); border-radius: 50%;
  animation: twinkle var(--dur, 3s) ease-in-out infinite var(--delay, 0s);
}
@keyframes twinkle {
  0%,100% { opacity: 0.2; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.4); }
}

/* ── MAIN LAYOUT ── */
.app {
  position: relative; z-index: 1;
  display: grid;
  grid-template-columns: 280px 1fr;
  min-height: 100vh;
}

/* ── SIDEBAR ── */
.sidebar {
  background: linear-gradient(180deg, #1a0800 0%, #2c1204 50%, #1a0800 100%);
  border-right: 1px solid var(--gold);
  padding: 0;
  display: flex; flex-direction: column;
  position: sticky; top: 0; height: 100vh;
  overflow-y: auto;
}

.sidebar-header {
  padding: 28px 20px 20px;
  border-bottom: 1px solid rgba(201,168,76,0.3);
  text-align: center;
}

.sidebar-title {
  font-family: 'Cinzel', serif;
  font-size: 13px;
  letter-spacing: 3px;
  color: var(--gold);
  text-transform: uppercase;
  margin-bottom: 4px;
}

.sidebar-sub {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 11px;
  color: rgba(232,201,122,0.5);
}

.crest {
  width: 56px; height: 56px;
  margin: 14px auto 10px;
  display: grid; grid-template-columns: 1fr 1fr;
  border: 1.5px solid var(--gold);
  border-radius: 2px;
  overflow: hidden;
}
.crest-q { display: flex; align-items: center; justify-content: center; font-size: 11px; }
.crest-q:nth-child(1) { background: var(--gryffindor); }
.crest-q:nth-child(2) { background: var(--slytherin); }
.crest-q:nth-child(3) { background: var(--ravenclaw); }
.crest-q:nth-child(4) { background: var(--hufflepuff); }

.nav-section {
  padding: 12px 0 4px;
}

.nav-label {
  font-family: 'Cinzel', serif;
  font-size: 8px;
  letter-spacing: 2px;
  color: rgba(201,168,76,0.5);
  text-transform: uppercase;
  padding: 0 20px 6px;
}

.nav-btn {
  width: 100%;
  background: none; border: none;
  padding: 9px 20px;
  text-align: left;
  cursor: pointer;
  display: flex; align-items: center; gap: 10px;
  transition: all 0.2s;
  font-family: 'Cormorant Garamond', serif;
  font-size: 14px;
  color: rgba(232,201,122,0.7);
  position: relative;
}
.nav-btn:hover, .nav-btn.active {
  color: var(--gold-light);
  background: rgba(201,168,76,0.08);
}
.nav-btn.active::before {
  content: '';
  position: absolute; left: 0; top: 0; bottom: 0;
  width: 2px; background: var(--gold);
}
.nav-icon { font-size: 14px; width: 18px; text-align: center; }

.day-nav {
  padding: 12px 16px;
  border-top: 1px solid rgba(201,168,76,0.2);
  margin-top: auto;
}

.day-nav-label {
  font-family: 'Cinzel', serif;
  font-size: 8px; letter-spacing: 2px;
  color: rgba(201,168,76,0.5);
  text-transform: uppercase;
  margin-bottom: 8px;
}

.day-input-row {
  display: flex; gap: 6px; align-items: center;
}

.day-input {
  background: rgba(201,168,76,0.08);
  border: 1px solid rgba(201,168,76,0.3);
  color: var(--gold-light);
  border-radius: 4px;
  padding: 6px 8px;
  font-family: 'Cormorant Garamond', serif;
  font-size: 14px;
  width: 70px;
}

.day-go-btn {
  background: var(--gold);
  color: var(--dark-brown);
  border: none;
  border-radius: 4px;
  padding: 6px 12px;
  font-family: 'Cinzel', serif;
  font-size: 10px;
  cursor: pointer;
  letter-spacing: 1px;
}

.progress-bar {
  margin-top: 10px;
  height: 3px;
  background: rgba(201,168,76,0.15);
  border-radius: 2px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--gold), var(--gold-light));
  border-radius: 2px;
  transition: width 0.4s ease;
}
.progress-text {
  font-family: 'Cormorant Garamond', serif;
  font-size: 10px;
  color: rgba(201,168,76,0.5);
  text-align: right;
  margin-top: 4px;
}

/* ── MAIN CONTENT ── */
.main {
  padding: 40px;
  min-height: 100vh;
}

/* ── PAGE CARD ── */
.page-card {
  background: var(--parchment);
  border-radius: 2px;
  max-width: 680px;
  margin: 0 auto;
  box-shadow: 0 0 80px rgba(201,168,76,0.12), 0 2px 40px rgba(0,0,0,0.6);
  position: relative;
  overflow: hidden;
  animation: pageIn 0.5s ease;
}
@keyframes pageIn {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

.page-card::before {
  content: '';
  position: absolute; inset: 0;
  background: 
    repeating-linear-gradient(transparent, transparent 27px, rgba(196,168,130,0.18) 27px, rgba(196,168,130,0.18) 28px);
  pointer-events: none;
}

.page-border {
  position: absolute; inset: 8px;
  border: 1px solid rgba(201,168,76,0.35);
  pointer-events: none; z-index: 2;
}

/* ── COVER PAGE ── */
.cover-page {
  background: linear-gradient(160deg, #1a0800, #2c1204, #0d0500);
  min-height: 600px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center;
  padding: 60px 40px;
}

.cover-border-outer {
  position: absolute; inset: 10px;
  border: 2px solid var(--gold);
}
.cover-border-inner {
  position: absolute; inset: 15px;
  border: 0.5px solid rgba(232,201,122,0.4);
}

.cover-title-small {
  font-family: 'Cinzel', serif;
  font-size: 12px; letter-spacing: 5px;
  color: rgba(201,168,76,0.7);
  text-transform: uppercase;
  margin-bottom: 8px;
}

.cover-title {
  font-family: 'IM Fell English', serif;
  font-size: 52px;
  color: var(--gold);
  line-height: 1.1;
  margin-bottom: 6px;
}

.cover-divider {
  display: flex; align-items: center; gap: 12px;
  margin: 14px 0;
  color: var(--gold);
}
.cover-divider::before, .cover-divider::after {
  content: ''; flex: 1;
  height: 1px; background: linear-gradient(90deg, transparent, var(--gold));
}
.cover-divider::after { transform: scaleX(-1); }

.cover-sub {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 16px;
  color: rgba(232,201,122,0.7);
  line-height: 1.6;
}

.cover-crest-large {
  width: 100px; height: 120px;
  margin: 24px auto;
  display: grid; grid-template-columns: 1fr 1fr;
  border: 2px solid var(--gold);
  position: relative;
}
.cover-crest-large .crest-q { font-size: 20px; }

.cover-stats {
  font-family: 'Cinzel', serif;
  font-size: 9px; letter-spacing: 3px;
  color: rgba(201,168,76,0.5);
  text-transform: uppercase;
  margin-top: 20px;
}

/* ── PAGE HEADER ── */
.pg-header {
  background: var(--mid-brown);
  padding: 14px 24px;
  display: flex; align-items: center; justify-content: space-between;
  position: relative; z-index: 1;
}

.pg-day {
  font-family: 'Cinzel', serif;
  font-size: 12px; letter-spacing: 2px;
  color: var(--gold);
  text-transform: uppercase;
}

.pg-date-input {
  background: none; border: none;
  border-bottom: 1px solid rgba(201,168,76,0.4);
  font-family: 'Cormorant Garamond', serif;
  font-size: 13px; color: var(--gold-light);
  width: 120px; text-align: right;
  outline: none; padding: 2px 4px;
}
.pg-date-input::placeholder { color: rgba(232,201,122,0.35); }

/* ── PROMPT BOX ── */
.prompt-box {
  margin: 20px 24px 0;
  background: var(--gold-pale);
  border: 1px solid rgba(201,168,76,0.5);
  border-radius: 3px;
  padding: 12px 16px;
  position: relative; z-index: 1;
}

.prompt-label {
  font-family: 'Cinzel', serif;
  font-size: 8px; letter-spacing: 2px;
  color: var(--rust);
  text-transform: uppercase;
  margin-bottom: 5px;
}

.prompt-text {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 14px;
  color: var(--mid-brown);
  line-height: 1.5;
}

/* ── SECTIONS ── */
.sections-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0;
  padding: 16px 24px 0;
  position: relative; z-index: 1;
}

.section-block {
  padding: 10px 8px;
}

.section-block.full {
  grid-column: 1 / -1;
}

.section-label {
  font-family: 'Cinzel', serif;
  font-size: 8px; letter-spacing: 1.5px;
  color: var(--rust);
  text-transform: uppercase;
  margin-bottom: 6px;
  display: flex; align-items: center; gap: 6px;
}
.section-label::before { content: '✦'; font-size: 8px; }

.journal-textarea {
  width: 100%;
  background: transparent;
  border: none;
  border-bottom: 1px solid var(--faint);
  outline: none;
  font-family: 'Cormorant Garamond', serif;
  font-size: 14px;
  color: var(--ink);
  line-height: 1.9;
  resize: none;
  padding: 4px 0;
  min-height: 60px;
}

.journal-textarea.tall { min-height: 100px; }
.journal-textarea.xl { min-height: 140px; }

.journal-textarea::placeholder {
  color: rgba(92,51,23,0.25);
  font-style: italic;
}

/* ── SCHEDULE ── */
.schedule-grid {
  display: grid;
  grid-template-columns: 42px 1fr;
  gap: 0;
  padding: 10px 24px;
  position: relative; z-index: 1;
}

.time-label {
  font-family: 'Cinzel', serif;
  font-size: 9px;
  color: var(--gold);
  padding: 5px 6px 5px 0;
  border-bottom: 1px solid var(--faint);
  line-height: 1.6;
}

.time-input {
  background: transparent;
  border: none;
  border-bottom: 1px solid var(--faint);
  outline: none;
  font-family: 'Cormorant Garamond', serif;
  font-size: 13px;
  color: var(--ink);
  padding: 5px 6px;
  width: 100%;
}
.time-input::placeholder { color: rgba(92,51,23,0.2); font-style: italic; }

/* ── DIVIDER ── */
.gold-divider {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 24px;
  position: relative; z-index: 1;
  color: var(--gold);
  font-size: 10px;
}
.gold-divider::before, .gold-divider::after {
  content: ''; flex: 1;
  height: 1px; background: var(--faint);
}

/* ── WEEKLY PAGE ── */
.weekly-header {
  background: var(--dark-brown);
  padding: 18px 24px;
  text-align: center;
}

.weekly-title {
  font-family: 'Cinzel', serif;
  font-size: 16px; letter-spacing: 4px;
  color: var(--gold);
  text-transform: uppercase;
}

.quote-banner {
  background: var(--gold-pale);
  border-top: 1px solid var(--gold);
  border-bottom: 1px solid var(--gold);
  padding: 12px 24px;
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 13px;
  color: var(--mid-brown);
  text-align: center;
  line-height: 1.5;
  position: relative; z-index: 1;
}

.days-row {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
  padding: 14px 20px;
  position: relative; z-index: 1;
}

.day-cell {
  background: var(--parchment2);
  border: 1px solid var(--faint);
  border-radius: 2px;
  padding: 6px 4px;
  text-align: center;
}

.day-cell-name {
  font-family: 'Cinzel', serif;
  font-size: 8px; letter-spacing: 1px;
  color: var(--gold);
  margin-bottom: 4px;
}

.day-cell-input {
  width: 100%;
  background: transparent;
  border: none; outline: none;
  font-family: 'Cormorant Garamond', serif;
  font-size: 11px; color: var(--ink);
  text-align: center;
  min-height: 36px; resize: none;
}

.habit-tracker {
  padding: 10px 20px 16px;
  position: relative; z-index: 1;
}

.habit-label {
  font-family: 'Cinzel', serif;
  font-size: 8px; letter-spacing: 2px;
  color: var(--rust);
  text-transform: uppercase;
  margin-bottom: 8px;
}

.habits-row {
  display: flex; gap: 6px; flex-wrap: wrap;
}

.habit-pill {
  background: var(--parchment2);
  border: 1px solid var(--faint);
  border-radius: 20px;
  padding: 4px 14px;
  font-family: 'Cormorant Garamond', serif;
  font-size: 12px;
  color: var(--mid-brown);
  cursor: pointer;
  transition: all 0.2s;
  user-select: none;
}
.habit-pill.done {
  background: var(--gold);
  border-color: var(--gold);
  color: var(--dark-brown);
  font-weight: 600;
}

/* ── MONTHLY PAGE ── */
.monthly-calendar {
  padding: 14px 20px;
  position: relative; z-index: 1;
}

.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 2px;
}

.cal-dow {
  font-family: 'Cinzel', serif;
  font-size: 8px; letter-spacing: 1px;
  color: var(--gold);
  text-align: center;
  padding: 4px 0;
}

.cal-day {
  background: var(--parchment2);
  border: 1px solid var(--faint);
  border-radius: 2px;
  padding: 4px;
  min-height: 36px;
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
}
.cal-day:hover { background: var(--gold-pale); border-color: var(--gold); }
.cal-day.has-entry { border-color: var(--gold); }
.cal-day.has-entry::after {
  content: '✦';
  position: absolute; bottom: 2px; right: 3px;
  font-size: 7px; color: var(--gold);
}

.cal-day-num {
  font-family: 'Cinzel', serif;
  font-size: 10px;
  color: var(--dark-brown);
}

.cal-empty { background: none; border: none; }

/* ── MOOD TRACKER ── */
.mood-row {
  display: flex; gap: 8px; flex-wrap: wrap;
  padding: 10px 24px;
  position: relative; z-index: 1;
}

.mood-btn {
  background: var(--parchment2);
  border: 1px solid var(--faint);
  border-radius: 20px;
  padding: 5px 14px;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
}
.mood-btn.active {
  background: var(--gold-pale);
  border-color: var(--gold);
  transform: scale(1.1);
}

/* ── SAVE INDICATOR ── */
.save-toast {
  position: fixed; bottom: 24px; right: 24px;
  background: var(--dark-brown);
  border: 1px solid var(--gold);
  color: var(--gold-light);
  font-family: 'Cinzel', serif;
  font-size: 10px; letter-spacing: 2px;
  padding: 10px 18px;
  border-radius: 2px;
  transform: translateY(80px); opacity: 0;
  transition: all 0.3s;
  z-index: 100;
}
.save-toast.show { transform: translateY(0); opacity: 1; }

/* ── PAGE FOOTER ── */
.page-footer {
  display: flex; align-items: center; justify-content: center;
  padding: 12px 24px 20px;
  position: relative; z-index: 1;
}
